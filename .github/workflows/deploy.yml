name: Deploy to AWS EC2

on:
  push:
    branches:
      - AWS
      - TEST

jobs:

  deploy-production:
    if: github.ref == 'refs/heads/AWS'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Production
        run: |
          rsync -avz --delete \
          --exclude '.git' \
          --exclude '.github' \
          -e "ssh -i ~/.ssh/key.pem" \
          ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/current/

          ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo systemctl reload apache2
          "

  deploy-test:
    if: github.ref == 'refs/heads/TEST'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TEST_EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H "${{ secrets.TEST_EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Test Server
        run: |
          rsync -avz --delete \
          --exclude '.git' \
          --exclude '.github' \
          -e "ssh -i ~/.ssh/key.pem" \
          ./ ${{ secrets.TEST_EC2_USER }}@${{ secrets.TEST_EC2_HOST }}:/var/www/test/

          ssh -i ~/.ssh/key.pem ${{ secrets.TEST_EC2_USER }}@${{ secrets.TEST_EC2_HOST }} "
            sudo systemctl reload apache2
          "