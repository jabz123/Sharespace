name: Deploy to AWS EC2

on:
  push:
    branches:
      - AWS

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
        chmod 600 ~/.ssh/key.pem
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
    
    - name: Ensure SUMMARY_API_KEY is set in Apache env
      run: |
        ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
          set -e
          echo 'SetEnv SUMMARY_API_KEY \"${{ secrets.SUMMARY_API_KEY }}\"' | sudo tee /etc/apache2/conf-available/sharedspace-env.conf > /dev/null
          sudo a2enconf sharedspace-env
          sudo apachectl configtest
          sudo systemctl reload apache2
        "

    - name: Prepare New Release
      run: |
        RELEASE=$(date +%Y%m%d%H%M%S)
        echo "RELEASE=$RELEASE" >> $GITHUB_ENV

        ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
          mkdir -p /var/www/releases/$RELEASE &&
          chown -R ${{ secrets.EC2_USER }}:www-data /var/www/releases/$RELEASE
        "

    - name: Upload Files
      run: |
        rsync -avz --checksum --delete \
          --exclude ".git" \
          --exclude ".github" \
          --exclude "public/uploads" \
          -e "ssh -i ~/.ssh/key.pem" \
          ./ \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/releases/${{ env.RELEASE }}/

    - name: Activate New Release
      run: |
        OLD_RELEASE=$(ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "readlink -f /var/www/current || true")

        echo "OLD_RELEASE=$OLD_RELEASE" >> $GITHUB_ENV

        ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
          ln -sfn /var/www/storage/uploads /var/www/releases/${{ env.RELEASE }}/public/uploads &&
          ln -sfn /var/www/releases/${{ env.RELEASE }} /var/www/current &&
          sudo systemctl reload apache2
        "

    - name: Verify Deployment
      run: |
        sleep 5

        if curl -f http://${{ secrets.EC2_HOST }}/index.php > /dev/null; then
          echo "Deployment successful."
        else
          echo "Health check failed. Rolling back..."

          if [ -n "${{ env.OLD_RELEASE }}" ]; then
            ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
              ln -sfn ${{ env.OLD_RELEASE }} /var/www/current &&
              sudo systemctl reload apache2
            "
          fi

          exit 1
        fi

    - name: Cleanup Old Releases
      run: |
        ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
          cd /var/www/releases &&
          ls -1dt */ | tail -n +6 | xargs -r rm -rf
        "